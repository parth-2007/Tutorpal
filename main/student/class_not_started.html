  <script src="chat/js/webflow.js" type="text/javascript"></script>
  <script>
  function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                // Does this cookie string begin with the name we want?
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
  }
  const csrftoken = getCookie('csrftoken');
  const refreshToken = localStorage.getItem("refresh")
  fetch('http://127.0.0.1:8000/api-auth/token/refresh/', {
      method: "POST",
      headers: {
        'Content-type':'application/json',
        'X-CSRFToken': csrftoken,
      },
      body: JSON.stringify({"refresh": refreshToken})
  }).then((resp)=> {
        try{
            resp.json().then((data) => {
              localStorage.setItem("access", data.access);
            });
        } catch (e) {
            console.log(e)
        }
  });
  const accessToken = localStorage.getItem("access")              
  fetch("http://127.0.0.1:8000/users/me/", {
      method: "GET",
      credentials: 'same-origin',
      headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json',
          'X-CSRFToken': csrftoken,
          'Authorization': 'Bearer ' + accessToken, // This is important for identifying user
      },
  }).then((resp) => {
      resp.json().then((data) => {
        if(data.tutor ==null){
            document.getElementById("main").innerHTML = "";
            document.getElementById("body").style.backgroundColor = "white";
            document.write("<h1><strong>404 Not Found<strong></h1>")
        }                                        
      })
  })
  </script>
