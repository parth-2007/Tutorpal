  <script>

  var current_url = window.location.href;
  key = current_url.slice(57);
  
  console.log(key)
  var url = "127.0.0.1:8000/tutors/search/?q="+key+"/";
  function getCookie(name) {
      let cookieValue = null;
      if (document.cookie && document.cookie !== '') {
          const cookies = document.cookie.split(';');
          for (let i = 0; i < cookies.length; i++) {
              const cookie = cookies[i].trim();
              if (cookie.substring(0, name.length + 1) === (name + '=')) {
                  cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                  break;
              }
          }
      }
      return cookieValue;
  }
  const csrftoken = getCookie('csrftoken');

  var wrapper = document.getElementById('posts');
  fetch(url, {
      method: "GET",
      credentials: 'same-origin',
      headers: {
          "Access-Control-Allow-Origin": "*",
          'Content-Type': 'application/json',
          'Accept': 'application/json',
          'X-CSRFToken': csrftoken,
      },
  }).then((resp) => {
      resp.json().then((data) => {
          var list = data.results;
          list.forEach(function(value) {
              user = value.user;
              full_name = user.first_name + " " + user.last_name
              id = value.id;
              subject = value.subjects;
              price = value.rates;
              education = value.education
              major = value.major;
              school = value.school;
              gpa = value.gpa;
              reviews = value.average_reviews;
              occupation = value.occupation;
              linkedin = value.linkedIn;
              if (value.linkedIn != ""){
                var item = `
                  <a href="http://127.0.0.1:5500/main/student/tutor-profile.html?profile=${id}" class="link-block-2 w-inline-block">
                    <div class="div-block-54"><img src="student/images/user-2.png" loading="lazy" width="38" height="38" srcset="student/images/user-2.png 500w, student/images/user-2.png 512w" sizes="38px" alt="" class="image-5">
                      <div class="text-block-21"><strong class="bold-text-3">${full_name}</strong></div>
                          <div class="text-block-21-copy">Subject: ${subject}</div>
                          <div class="text-block-21-copy-2">Price: ${price} hourly</div>
                          <div class="text-block-21-copy-2">Degree: ${education}</div>
                          <div class="text-block-21-copy-2">Education: ${major} at ${school}, GPA of ${gpa}</div>
                          <div class="text-block-21-copy-2">Reviews: ${reviews} Stars</div>
                          <div class="text-block-21-copy-2">Occupation: ${occupation}</div>
                          <div style="color: green; font-size: 24px;"class="text-block-21-copy-2"><strong>✓</strong></div>
                    </div>
                  </a>
                `
                wrapper.innerHTML+=item
              }
              else{
                var item = `
                  <a href="http://127.0.0.1:5500/main/student/tutor-profile.html?profile=${id}" class="link-block-2 w-inline-block">
                    <div class="div-block-54"><img src="student/images/user-2.png" loading="lazy" width="38" height="38" srcset="student/images/user-2.png 500w, student/images/user-2.png 512w" sizes="38px" alt="" class="image-5">
                      <div class="text-block-21"><strong class="bold-text-3">${full_name}</strong></div>
                          <div class="text-block-21-copy">Subject: ${subject}</div>
                          <div class="text-block-21-copy-2">Price: ${price} hourly</div>
                          <div class="text-block-21-copy-2">Degree: ${education}</div>
                          <div class="text-block-21-copy-2">Education: ${major} at ${school}, GPA of ${gpa}</div>
                          <div class="text-block-21-copy-2">Reviews: ${reviews} Stars</div>
                          <div class="text-block-21-copy-2">Occupation: ${occupation}</div>
                    </div>
