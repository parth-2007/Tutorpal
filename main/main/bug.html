  <script>
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                // Does this cookie string begin with the name we want?
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
    const csrftoken = getCookie('csrftoken');
    console.log(csrftoken)

    var form = document.getElementById('form-wrapper');
    form.addEventListener('submit',function(e){
      e.preventDefault()
      console.log("Form Submitted")
      var bugstext = document.getElementById('bugs').value;
      var buglevel = document.getElementById('buglevel').value;
      console.log(bugstext)
      console.log(buglevel)
      const url = 'http://127.0.0.1:8000/bugs/';

      fetch(url, {
          method: "POST",
          headers: {
              "Access-Control-Allow-Origin": "*",
              'Content-Type': 'application/json',
              'Accept': 'application/json',
              'X-CSRFToken': csrftoken,
          },
          body:JSON.stringify({"bug":bugstext, "level":buglevel})
      })
    });
    
  </script>
