  <div style="height: auto; font-family: Poppins; padding-bottom: 20px;"class="div-block">
    <div>
      Please let us know what user feedback you have so we can continue to improve our product. 
      <form>
        <div style="margin-top: 20px;"class="mb-3">
          <label for="feedback" class="form-label">Feedback</label>
          <textarea style="height:250px;"class="form-control" id="feedback" rows="3"></textarea>
          <button class="btn btn-primary" onclick="getformvals()"style="margin-top: 10px;">Submit</button>
        </div>
      </form>
    </div>
  </div>
  <script src="https://d3e54v103j8qbb.cloudfront.net/js/jquery-3.5.1.min.dc5e7f18c8.js?site=5f7126183c67c77cd1865773" type="text/javascript" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
  <script src="tz/js/webflow.js" type="text/javascript"></script>
  <script>
    
    function getformvals(){
      var feedbacktext = document.getElementById('feedback').value;

      const url = 'http://127.0.0.1:8000/feedback/';

      fetch(url, {
          method: "POST",
          headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json',
          },
          body:JSON.stringify({"text":feedbacktext})
      })
    }
  </script>
