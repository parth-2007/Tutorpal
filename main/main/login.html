  <script>
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                // Does this cookie string begin with the name we want?
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
    const csrftoken = getCookie('csrftoken');

    function getformvals(){
      var email = document.getElementById('email').value;
      var password = document.getElementById('password').value;
      fetch("http://127.0.0.1:8000/api-auth/token/", {
          method: "POST",
          headers: {
              "Access-Control-Allow-Origin": "*",
              'Content-Type': 'application/json',
              'Accept': 'application/json',
              'X-CSRFToken': csrftoken,
          },
          body:JSON.stringify({
            email: email,
            password: password,
          })
        }).then((resp)=> {
            try {
                resp.json().then((data) => {
                    localStorage.setItem("refresh", data.refresh);
                    localStorage.setItem("access", data.access);
                    refreshToken = localStorage.getItem("refresh");
                    fetch('http://127.0.0.1:8000/api-auth/token/refresh/', {
                        method: "POST",
                        headers: {
                            'Content-type':'application/json',
                            'X-CSRFToken': csrftoken,
                        },
                        body: JSON.stringify({"refresh": refreshToken})
                    }).then((resp)=> {
                        try {
                            resp.json().then((data) => {
                                localStorage.setItem("access", data.access);
                                accessToken = localStorage.getItem("access");
                                fetch("http://127.0.0.1:8000/users/me/", {
                                    method: "GET",
                                    credentials: 'same-origin',
                                    headers: {
                                        'Content-Type': 'application/json',
                                        'Accept': 'application/json',
                                        'X-CSRFToken': csrftoken,
                                        'Authorization': 'Bearer ' + accessToken, // This is important for identifying user
                                    },
                                }).then((resp) => {
                                    resp.json().then((data) => {
                                        console.log(data)
                                        if(data.tutor !=null){
                                            const id = data.tutor;
                                            const type = "student";
                                            var email = data.email;
                                            var fullname = data.first_name + " " + data.last_name;
                                            var pfp = data.profile_pic;
                                            localStorage.setItem("id", id);
                                            localStorage.setItem("email", email);
                                            localStorage.setItem("name", fullname);
                                            localStorage.setItem("pfp", pfp);
                                            localStorage.setItem("type", type);
                                            window.location = 'http://127.0.0.1:5500/main/student/index.html'; 
                                        }
                                        else if(data.student !=null){
                                            var id = data.student;
                                            var type = "tutor";
                                            var email = data.email;
                                            var fullname = data.first_name + " " + data.last_name;
                                            var pfp = data.profile_pic;
                                            localStorage.setItem("id", id);
                                            localStorage.setItem("email", email);
                                            localStorage.setItem("name", fullname);
                                            localStorage.setItem("pfp", pfp);
                                            localStorage.setItem("type", type);
                                            window.location = 'http://127.0.0.1:5500/main/tutor/index.html'; 
                                        }
                                        console.log(type)
                                    })
                                })
                            })
                        } catch (e) {
                            console.log(e)
                        }
                    });
                })
            } catch (e) {
                console.log(e);
            }
        }); 
    }
    
  </script>
